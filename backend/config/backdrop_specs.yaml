# Backdrop pre-generation specs. The backdrop_generator worker reads this file
# and creates one Backdrop row per slug, calling the image provider chain with
# NO character LoRAs. Idempotent on slug — re-running the worker skips slugs
# that already exist unless --regenerate is passed.
#
# Lighting profile is used both for retrieval (match poses with similar
# lighting) and to seed the lighting unification img2img prompt at runtime.
#
# Tags drive Tier 3 backdrop selection: the scene classifier emits a tag set,
# we rank backdrops by tag overlap, top match wins.

backdrops:
  # ── Tavern / inns ────────────────────────────────────────────────────────
  - slug: tavern_interior_warm
    prompt: "warm cozy tavern interior, wooden beams, fireplace glow, empty space in foreground for characters, painterly cinematic lighting, no people"
    tags: [indoor, tavern, warm-light, fantasy, cozy]
    lighting_profile: {direction: left, warmth: warm, intensity: soft}
    aspect_ratio: "3:2"

  - slug: tavern_corner_dim
    prompt: "dim tavern back-room corner booth, candle on table, smoky atmosphere, deep shadows, painterly cinematic, no people"
    tags: [indoor, tavern, low-light, intimate, fantasy]
    lighting_profile: {direction: top, warmth: warm, intensity: low}
    aspect_ratio: "3:2"

  - slug: inn_bedroom_morning
    prompt: "rustic inn bedroom at morning, sunlight through wooden shutters, made bed, simple furniture, no people"
